name: Deploy OBPL website to AWS (S3 + CloudFront)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BUCKET: orbitbeyond-india-site-prod
  DISTRIBUTION_ID: ERHGFZ5GKBO7Z

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Sync site files (short cache, everything except /assets)
        run: |
          aws s3 sync . s3://$BUCKET/ \
            --delete \
            --exclude "assets/*" \
            --exclude ".git/*" --exclude ".github/*" --exclude ".vercel/*" --exclude ".claude/*" \
            --exclude "tools/*" --exclude "build_pages.py" --exclude ".gitignore" --exclude "vercel.json" --exclude "README.md" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Sync assets (long-lived immutable cache)
        run: |
          aws s3 sync assets/ s3://$BUCKET/assets/ \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"
